[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rg-unified-llm-client"
version = "0.1.0"
description = "Unified LLM Client for the Resonant Genesis platform — one client, every provider, every surface."
readme = "README.md"
license = "LicenseRef-RG-Source-Available"
requires-python = ">=3.10"
authors = [
    { name = "Resonant Genesis", email = "dev@resonantgenesis.com" },
]
keywords = ["llm", "ai", "openai", "groq", "anthropic", "gemini", "byok"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
